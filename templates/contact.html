{% extends "base.html" %}
{% block title %}Contact — NovaShop{% endblock %}
{% block content %}
<h1>Contact us</h1>
<p class="muted">Questions about an order, a product or a return? Send us a message and we will get back to you within one business day.</p>
<form class="form form-narrow" method="post" action="{{ url_for('contact') }}">
  <label>Your name
    <input type="text" name="name" required>
  </label>
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>Subject
    <input type="text" name="subject">
  </label>
  <label>Message
    <textarea name="message" rows="5" required></textarea>
  </label>
  <button class="btn btn-lg" type="submit">Send message</button>
</form>
{% endblock %}
