{% extends "base.html" %}
{% block title %}Log in — NovaShop{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="form form-narrow" method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username
    <input type="text" name="username" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button class="btn btn-lg" type="submit">Log in</button>
  <p class="muted">No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>
</form>
{% endblock %}
